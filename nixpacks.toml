# Coolify + Nixpacks build hints. Most of this is auto-detected from
# pyproject.toml + uv.lock — these phases just make sure uv is used and the
# MCP server starts.

[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = ["uv sync --frozen --no-dev"]

[start]
cmd = "uv run pushpress-mcp --transport http --host 0.0.0.0 --port ${PORT:-8000}"
